<!DOCTYPE html>
<html lang="en" data-theme="cyber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdurrahman | Network Engineering & Automation</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            bg: 'var(--bg-main)',
                            card: 'var(--bg-card)',
                            text: 'var(--text-main)',
                            muted: 'var(--text-muted)',
                            accent: 'var(--accent)',
                            'accent-hover': 'var(--accent-hover)',
                            border: 'var(--border-color)',
                        }
                    },
                    fontFamily: {
                        primary: 'var(--font-primary)',
                        secondary: 'var(--font-secondary)',
                    },
                    borderRadius: {
                        theme: 'var(--border-radius)',
                    },
                    boxShadow: {
                        theme: 'var(--card-shadow)',
                        'theme-hover': 'var(--card-shadow-hover)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. CYBER-SEC (Default) */
        [data-theme="cyber"] {
            --bg-main: #050505;
            --bg-card: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #00ff00;
            --accent-rgb: 0, 255, 0; /* Used for Canvas Alpha */
            --accent-hover: #00cc00;
            --border-color: rgba(0, 255, 0, 0.3);
            --border-radius: 0px;
            --font-primary: 'JetBrains Mono', monospace;
            --font-secondary: 'JetBrains Mono', monospace;
            --card-shadow: 0 0 0px rgba(0, 255, 0, 0);
            --card-shadow-hover: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.1);
            --backdrop-blur: none;
        }

        /* 2. INFRASTRUCTURE (GitHub Dark Style) */
        [data-theme="infra"] {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-rgb: 88, 166, 255;
            --accent-hover: #79c0ff;
            --border-color: #30363d;
            --border-radius: 8px;
            --font-primary: 'Inter', sans-serif;
            --font-secondary: 'JetBrains Mono', monospace;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
            --card-shadow-hover: 0 8px 24px rgba(88, 166, 255, 0.15);
            --backdrop-blur: none;
        }

        /* 3. NEURAL RESEARCH (Modern Deep Dark/Amber) */
        [data-theme="neural"] {
            --bg-main: #09090b;
            --bg-card: rgba(24, 24, 27, 0.7);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #f97316;
            --accent-rgb: 249, 115, 22;
            --accent-hover: #fb923c;
            --border-color: rgba(249, 115, 22, 0.2);
            --border-radius: 24px;
            --font-primary: 'Inter', sans-serif;
            --font-secondary: 'Inter', sans-serif;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.5);
            --card-shadow-hover: 0 15px 40px rgba(249, 115, 22, 0.2);
            --backdrop-blur: blur(16px);
        }

        /* Canvas Background */
        #network-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none; /* Let clicks pass through to main content */
        }

        /* Card Interactive States */
        .dynamic-card {
            backdrop-filter: var(--backdrop-blur);
            -webkit-backdrop-filter: var(--backdrop-blur);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateZ(0); /* Hardware acceleration */
        }

        .dynamic-card:hover {
            border-color: var(--accent);
            transform: translateY(-8px) scale(1.02);
        }

        /* Blinking Terminal Cursor */
        .cursor-blink {
            animation: blink 1s step-end infinite;
            border-right: 2px solid var(--accent);
            padding-right: 4px;
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--accent); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: var(--border-radius); }
        
        .theme-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(128, 128, 128, 0.1);
        }
    </style>
</head>

<body class="antialiased flex flex-col relative transition-colors duration-500">

    <!-- Interactive Canvas Background -->
    <canvas id="network-canvas"></canvas>

    <!-- Theme Switcher (Top Right) -->
    <div class="fixed top-4 right-4 z-50 flex gap-2 p-2 rounded-full border border-theme-border bg-theme-bg/80 backdrop-blur-md shadow-theme transition-colors duration-500">
        <button onclick="setTheme('cyber')" id="btn-cyber" class="theme-btn w-10 h-10 rounded-full flex items-center justify-center text-theme-muted hover:text-theme-accent border border-transparent transition-all" title="Cyber-Sec Mode">
            <i class="fa-solid fa-terminal"></i>
        </button>
        <button onclick="setTheme('infra')" id="btn-infra" class="theme-btn w-10 h-10 rounded-full flex items-center justify-center text-theme-muted hover:text-theme-accent border border-transparent transition-all" title="Infrastructure Mode">
            <i class="fa-solid fa-server"></i>
        </button>
        <button onclick="setTheme('neural')" id="btn-neural" class="theme-btn w-10 h-10 rounded-full flex items-center justify-center text-theme-muted hover:text-theme-accent border border-transparent transition-all" title="Neural Research Mode">
            <i class="fa-solid fa-brain"></i>
        </button>
    </div>

    <!-- Main Container -->
    <main class="flex-grow container mx-auto px-6 py-20 md:py-32 max-w-5xl relative z-10 flex flex-col items-center">
        
        <header class="text-center mb-24 w-full">
            <div class="inline-block mb-6 p-5 rounded-theme bg-theme-card border border-theme-border shadow-theme transition-all duration-500 hover:scale-110">
                <i class="fa-solid fa-network-wired text-5xl text-theme-accent transition-colors duration-500"></i>
            </div>
            
            <h1 class="text-5xl md:text-7xl font-bold mb-4 tracking-tight text-theme-text font-primary transition-colors duration-500">
                Abdurrahman
            </h1>
            
            <h2 class="text-xl md:text-2xl font-secondary text-theme-muted transition-colors duration-500">
                <span class="cursor-blink">> Network Engineering & Automation_</span>
            </h2>
            
            <p class="mt-8 text-theme-muted max-w-2xl mx-auto leading-relaxed font-primary transition-colors duration-500 text-lg">
                Welcome to my public workspace. Below is a collection of tools, scripts, that make my life easier.
            </p>
        </header>

        <section id="tools-section" class="w-full mb-16">
            <div class="flex items-center gap-4 mb-10 w-full">
                <i class="fa-solid fa-layer-group text-theme-accent text-xl transition-colors duration-500"></i>
                <h3 class="text-2xl font-secondary font-bold text-theme-text uppercase tracking-wider transition-colors duration-500">Tools</h3>
                <div class="h-px bg-theme-border flex-grow ml-4 transition-colors duration-500"></div>
            </div>
            
            <div id="tools-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                <!-- Dynamically Injected -->
            </div>
        </section>
    </main>

    <footer class="border-t border-theme-border bg-theme-bg py-10 mt-auto z-10 relative transition-colors duration-500">
        <div class="container mx-auto px-6 text-center text-theme-muted font-secondary">
            <p>© <span id="year"></span> Abdurrahman. All systems operational.</p>
            <div class="flex justify-center gap-6 mt-6">
                <a href="#" class="hover:text-theme-accent transition-colors"><i class="fa-brands fa-github text-2xl"></i></a>
                <a href="#" class="hover:text-theme-accent transition-colors"><i class="fa-brands fa-linkedin text-2xl"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // 🛠️ CONFIGURATION
        const toolsList = [
            {
                name: 'Tasbeeh',
                url: 'https://dhyeem.github.io/Projects/tsbeeh',
                icon: 'fa-solid fa-fingerprint' 
            },
            {
                name: 'Cube Log Analyzer',
                url: 'https://dhyeem.github.io/Projects/cube/',
                icon: 'fa-solid fa-robot'
            }
        ];

        document.getElementById('year').textContent = new Date().getFullYear();

        // 🎨 THEME SWITCHING
        const themeButtons = {
            cyber: document.getElementById('btn-cyber'),
            infra: document.getElementById('btn-infra'),
            neural: document.getElementById('btn-neural')
        };
        
        let currentAccentRgb = "0, 255, 0"; // Default fallback

        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('portfolio-theme', themeName);

            Object.values(themeButtons).forEach(btn => btn.classList.remove('active'));
            if(themeButtons[themeName]) {
                themeButtons[themeName].classList.add('active');
            }

            // Update canvas color dynamically by reading the CSS variable
            setTimeout(() => {
                const rootStyles = getComputedStyle(document.documentElement);
                currentAccentRgb = rootStyles.getPropertyValue('--accent-rgb').trim();
            }, 50); // slight delay to allow CSS to apply
        }

        const savedTheme = localStorage.getItem('portfolio-theme') || 'cyber';
        setTheme(savedTheme);

        // 🚀 RENDER TOOLS
        const toolsGrid = document.getElementById('tools-grid');

        function renderTools() {
            toolsGrid.innerHTML = ''; 
            
            toolsList.forEach((tool, index) => {
                const delay = index * 150;
                const cardHTML = `
                    <a href="${tool.url}" target="_blank" rel="noopener noreferrer" 
                       class="dynamic-card aspect-video md:aspect-square rounded-theme bg-theme-card border border-theme-border shadow-theme hover:shadow-theme-hover p-8 flex flex-col items-center justify-center text-center group no-underline relative overflow-hidden"
                       style="animation: fadeIn 0.6s ease forwards ${delay}ms; opacity: 0;">
                        
                        <div class="w-20 h-20 rounded-theme bg-theme-bg border border-theme-border flex items-center justify-center mb-6 group-hover:-translate-y-2 group-hover:bg-theme-border transition-all duration-400">
                            <i class="${tool.icon} text-4xl text-theme-accent group-hover:text-theme-accent-hover transition-colors duration-400"></i>
                        </div>
                        
                        <h4 class="text-2xl font-bold text-theme-text mb-2 font-primary group-hover:text-theme-accent transition-colors duration-400">${tool.name}</h4>
                        
                        <div class="absolute bottom-6 opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-400">
                            <span class="text-sm font-secondary text-theme-accent bg-theme-accent/10 px-4 py-2 rounded-theme border border-theme-accent/30 flex items-center gap-2">
                                Launch <i class="fa-solid fa-arrow-right"></i>
                            </span>
                        </div>
                    </a>
                `;
                toolsGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(30px) scale(0.95); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }
        `;
        document.head.appendChild(style);
        renderTools();

        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const connectionDistance = 160;
        const particleCount = window.innerWidth < 768 ? 40 : 80;
        
        let mouse = { x: null, y: null };
        
        // Track mouse globally for interactivity
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx = -this.vx;
                if (this.y < 0 || this.y > height) this.vy = -this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${currentAccentRgb}, 0.6)`;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Connect to other particles
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${currentAccentRgb}, ${0.25 * (1 - distance / connectionDistance)})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }

                // Connect to mouse
                if (mouse.x != null && mouse.y != null) {
                    const dx = particles[i].x - mouse.x;
                    const dy = particles[i].y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance * 1.5) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${currentAccentRgb}, ${0.5 * (1 - distance / (connectionDistance * 1.5))})`;
                        ctx.lineWidth = 1.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                        
                        // slight magnetic effect towards mouse
                        if(distance < connectionDistance) {
                            particles[i].x -= dx * 0.01;
                            particles[i].y -= dy * 0.01;
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Delay starting animation slightly to ensure CSS variables are loaded
        setTimeout(animate, 100);
    </script>
</body>
</html>
